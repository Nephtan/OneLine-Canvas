<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVSG Power Simulator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for that industrial feel */
        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- Icons (Inline to avoid external dependencies) ---
        const IconWrapper = ({ children, className }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Icons = {
            Flame: ({ className }) => (
                <IconWrapper className={className}>
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.6-3.3.31.14.63.26.96.35.24.9.68 1.74 1.24 2.45z" />
                </IconWrapper>
            ),
            ShieldAlert: ({ className }) => (
                <IconWrapper className={className}>
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </IconWrapper>
            ),
            Activity: ({ className }) => (
                <IconWrapper className={className}>
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </IconWrapper>
            ),
            Info: ({ className }) => (
                <IconWrapper className={className}>
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="16" x2="12" y2="12" />
                    <line x1="12" y1="8" x2="12.01" y2="8" />
                </IconWrapper>
            )
        };

        const App = () => {
            const [switches, setSwitches] = useState({
                'UTILITY_1': true,
                'UTILITY_2': true,
                'MVSG1_W1': true,
                'MVSG1_W2': false, // NO Tie
                'MVSG1_W3': true,
                'MVSG1_W4': true,
                'MVSG2_W1': true,
                'MVSG2_W2': false, // NO Tie
                'MVSG2_W3': true,
                'MVSG2_W4': true, 
                'C1_S1': true, 'C1_S2': true,
                'C3_S1': true, 'C3_S2': false, // N.O. to Future C5
                'C5_S1': true, 'C5_S2': true,
                'C7_S1': true, 'C7_S2': true,
                'R2_S1': true, 'R2_S2': true,
                'C2_S1': true, 'C2_S2': true,
                'C4_S1': true, 'C4_S2': true,
                'R1_S1': true, 'R1_S2': false, // Tie to C6
                'H1_S2': true, 'H1_S1': true,
                'C8_S2': true, 'C8_S1': true,
                'C6_S2': true, 'C6_S1': true,
            });

            const toggleSwitch = (id) => {
                setSwitches(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const powerFlow = useMemo(() => {
                const status = {}; // { nodeID: { sources: Set(['U1', 'U2']) } }
                
                const adj = {
                    'UTILITY_1': ['MVSG1_W1'],
                    'MVSG1_W1': ['UTILITY_1', 'MVSG1_BUS'],
                    'MVSG1_BUS': ['MVSG1_W1', 'MVSG1_W2', 'MVSG1_W3', 'MVSG1_W4'],
                    'MVSG1_W2': ['MVSG1_BUS', 'MVSG2_W2'],
                    'MVSG1_W3': ['MVSG1_BUS', 'C2_S1'],
                    'MVSG1_W4': ['MVSG1_BUS', 'C1_S1'],
                    'UTILITY_2': ['MVSG2_W1'],
                    'MVSG2_W1': ['UTILITY_2', 'MVSG2_BUS'],
                    'MVSG2_BUS': ['MVSG2_W1', 'MVSG2_W2', 'MVSG2_W3', 'MVSG2_W4'],
                    'MVSG2_W2': ['MVSG2_BUS', 'MVSG1_W2'],
                    'MVSG2_W3': ['MVSG2_BUS', 'H1_S2'],
                    'MVSG2_W4': ['MVSG2_BUS', 'R2_S2'],
                    // Loop 2
                    'C1_S1': ['MVSG1_W4', 'C1_PTX'], 'C1_PTX': ['C1_S1', 'C1_S2'], 'C1_S2': ['C1_PTX', 'C3_S1'],
                    'C3_S1': ['C1_S2', 'C3_PTX'], 'C3_PTX': ['C3_S1', 'C3_S2'], 'C3_S2': ['C3_PTX', 'C5_S1'],
                    'C5_S1': ['C3_S2', 'C5_PTX'], 'C5_PTX': ['C5_S1', 'C5_S2'], 'C5_S2': ['C5_PTX', 'C7_S1'],
                    'C7_S1': ['C5_S2', 'C7_PTX'], 'C7_PTX': ['C7_S1', 'C7_S2'], 'C7_S2': ['C7_PTX', 'R2_S1'],
                    'R2_S1': ['C7_S2', 'R2_PTX'], 'R2_PTX': ['R2_S1', 'R2_S2'], 'R2_S2': ['R2_PTX', 'MVSG2_W4'],
                    // Loop 1
                    'C2_S1': ['MVSG1_W3', 'C2_PTX'], 'C2_PTX': ['C2_S1', 'C2_S2'], 'C2_S2': ['C2_PTX', 'C4_S1'],
                    'C4_S1': ['C2_S2', 'C4_PTX'], 'C4_PTX': ['C4_S1', 'C4_S2'], 'C4_S2': ['C4_PTX', 'R1_S1'],
                    'R1_S1': ['C4_S2', 'R1_PTX'], 'R1_PTX': ['R1_S1', 'R1_S2'], 'R1_S2': ['R1_PTX', 'C6_S1'],
                    'C6_S1': ['R1_S2', 'C6_PTX'], 'C6_PTX': ['C6_S1', 'C6_S2'], 'C6_S2': ['C6_PTX', 'C8_S1'],
                    'C8_S1': ['C6_S2', 'C8_PTX'], 'C8_PTX': ['C8_S1', 'C8_S2'], 'C8_S2': ['C8_PTX', 'H1_S1'],
                    'H1_S1': ['C8_S2', 'H1_PTX'], 'H1_PTX': ['H1_S1', 'H1_S2'], 'H1_S2': ['H1_PTX', 'MVSG2_W3'],
                };

                const propagate = (startNode, sourceKey) => {
                    const queue = [startNode];
                    const visited = new Set();
                    while (queue.length > 0) {
                        const curr = queue.shift();
                        if (visited.has(curr)) continue;
                        visited.add(curr);
                        
                        if (!status[curr]) status[curr] = new Set();
                        status[curr].add(sourceKey);

                        const neighbors = adj[curr] || [];
                        for (const next of neighbors) {
                            if (switches[next] !== undefined) {
                                if (switches[next]) queue.push(next);
                            } else {
                                queue.push(next);
                            }
                        }
                    }
                };

                if (switches['UTILITY_1']) propagate('UTILITY_1', 'U1');
                if (switches['UTILITY_2']) propagate('UTILITY_2', 'U2');

                return status;
            }, [switches]);

            const Node = ({ id, label, type, sublabel }) => {
                const sources = powerFlow[id] || new Set();
                const isLive = sources.size > 0;
                const isConflict = sources.size > 1;
                const isBackfed = (sources.has('U2') && id.startsWith('MVSG1')) || (sources.has('U1') && id.startsWith('MVSG2'));
                const isSwitch = switches[id] !== undefined;

                let bgClass = 'bg-slate-800 border-slate-700 text-slate-500';
                
                if (isConflict) {
                    bgClass = 'bg-red-900/50 border-red-500 text-red-100 animate-pulse ring-1 ring-red-500';
                } else if (isBackfed) {
                    bgClass = 'bg-orange-900/40 border-orange-500 text-orange-200';
                } else if (isLive) {
                    bgClass = 'bg-yellow-500/20 border-yellow-500 text-yellow-100';
                }

                return (
                    <div 
                        className={`
                            relative p-2 rounded border transition-all duration-300 flex flex-col items-center min-w-[70px] select-none
                            ${bgClass} 
                            ${isSwitch ? 'cursor-pointer hover:bg-slate-700' : 'cursor-default'}
                        `}
                        onClick={() => isSwitch && toggleSwitch(id)}
                    >
                        <div className="text-[9px] font-bold opacity-60 uppercase tracking-widest">{type}</div>
                        <div className="text-xs font-black tracking-tight leading-none">{label}</div>
                        
                        {isSwitch ? (
                            <div className={`
                                text-[9px] font-bold px-1.5 py-0.5 rounded mt-1.5 w-full text-center
                                ${switches[id] ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}
                            `}>
                                {switches[id] ? 'CLSD' : 'OPEN'}
                            </div>
                        ) : (
                            /* Spacer to ensure PTX/Grid nodes aren't smaller than switches */
                            <div className="h-[18px] mt-1.5 w-full"></div>
                        )}
                        
                        {isConflict && <Icons.Flame className="absolute -top-1 -right-1 w-5 h-5 text-red-500 drop-shadow-lg z-10" />}
                    </div>
                );
            };

            const Row = ({ children, title }) => (
                <div className="space-y-1">
                    <div className="flex items-center gap-2">
                        <div className="h-2 w-2 bg-slate-600 rounded-full"></div>
                        <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{title}</div>
                    </div>
                    <div className="flex flex-nowrap gap-2 items-center overflow-visible">
                        {children}
                    </div>
                </div>
            );

            const Wire = ({ active, conflict }) => (
                <div className={`
                    h-1 w-6 rounded-full transition-all duration-500 shrink-0
                    ${conflict ? 'bg-red-500 shadow-[0_0_5px_rgba(239,68,68,0.8)]' : active ? 'bg-yellow-400 shadow-[0_0_5px_rgba(250,204,21,0.6)]' : 'bg-slate-700'}
                `} />
            );

            const Spacer = () => <div className="w-1"></div>;

            const isConflictPresent = Object.values(powerFlow).some(s => s.size > 1);

            return (
                <div className="min-h-screen bg-slate-950 p-4 font-mono text-slate-200">
                    <div className="w-full space-y-6">
                        
                        {/* Header Block */}
                        <div className={`
                            p-4 rounded-lg flex justify-between items-center border-b-2 transition-colors duration-500
                            ${isConflictPresent ? 'bg-red-950/80 border-red-600' : 'bg-slate-900 border-slate-700'}
                        `}>
                            <div>
                                <h1 className="text-xl font-black flex items-center gap-2 tracking-tighter text-white">
                                    <Icons.Activity className={`w-6 h-6 ${isConflictPresent ? 'text-red-500' : 'text-blue-500'}`} />
                                    MVSG MONITOR
                                </h1>
                            </div>
                            
                            <div className="flex gap-4">
                                {isConflictPresent && (
                                    <div className="text-red-500 font-bold text-sm animate-pulse flex items-center gap-1">
                                        <Icons.Flame className="w-5 h-5" /> PHASE CONFLICT
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* The Grid - Main Container */}
                        <div className="bg-slate-900/50 p-6 rounded-xl shadow-xl border border-slate-800 space-y-8 overflow-x-hidden">
                            
                            {/* TOP: Sources & Switchgears */}
                            <div className="grid grid-cols-2 gap-8">
                                {/* Left Side: Utility 1 & MVSG 1 */}
                                <div className="space-y-4 flex flex-col items-start">
                                    <div className="flex items-center gap-2">
                                        <Node id="UTILITY_1" label="UTIL 01" type="Grid" />
                                        <Wire active={powerFlow['UTILITY_1']?.size > 0} conflict={powerFlow['UTILITY_1']?.size > 1} />
                                        <div className="text-[10px] text-slate-500 font-bold">12.47kV</div>
                                    </div>
                                    <div className="p-3 rounded bg-slate-900/80 border border-slate-800">
                                        <div className="text-[9px] text-slate-500 font-bold mb-2">MVSG 01</div>
                                        <div className="flex gap-2">
                                            <Node id="MVSG1_W1" label="W1: IN" type="MVSG" />
                                            <Node id="MVSG1_W2" label="W2: TIE" type="MVSG" />
                                            <Node id="MVSG1_W3" label="W3: LP1" type="MVSG" />
                                            <Node id="MVSG1_W4" label="W4: LP2" type="MVSG" />
                                        </div>
                                        <div className="h-1.5 w-full bg-slate-800 rounded relative mt-2 overflow-hidden">
                                            <div className={`absolute inset-0 transition-all duration-300 ${powerFlow['MVSG1_BUS']?.size > 1 ? 'bg-red-500' : powerFlow['MVSG1_BUS']?.size > 0 ? 'bg-yellow-400' : 'opacity-0'}`} />
                                        </div>
                                    </div>
                                </div>

                                {/* Right Side: Utility 2 & MVSG 2 */}
                                <div className="space-y-4 flex flex-col items-end">
                                    <div className="flex items-center gap-2 flex-row-reverse">
                                        <Node id="UTILITY_2" label="UTIL 02" type="Grid" />
                                        <Wire active={powerFlow['UTILITY_2']?.size > 0} conflict={powerFlow['UTILITY_2']?.size > 1} />
                                        <div className="text-[10px] text-slate-500 font-bold">12.47kV</div>
                                    </div>
                                    <div className="p-3 rounded bg-slate-900/80 border border-slate-800 flex flex-col items-end">
                                        <div className="text-[9px] text-slate-500 font-bold mb-2 w-full text-right">MVSG 02</div>
                                        <div className="flex gap-2 flex-row-reverse">
                                            <Node id="MVSG2_W1" label="W1: IN" type="MVSG" />
                                            <Node id="MVSG2_W2" label="W2: TIE" type="MVSG" />
                                            <Node id="MVSG2_W3" label="W3: LP1" type="MVSG" />
                                            <Node id="MVSG2_W4" label="W4: LP2" type="MVSG" />
                                        </div>
                                        <div className="h-1.5 w-full bg-slate-800 rounded relative mt-2 overflow-hidden">
                                            <div className={`absolute inset-0 transition-all duration-300 ${powerFlow['MVSG2_BUS']?.size > 1 ? 'bg-red-500' : powerFlow['MVSG2_BUS']?.size > 0 ? 'bg-yellow-400' : 'opacity-0'}`} />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* LOOPS CONTAINER */}
                            <div className="space-y-8 pt-4 border-t border-slate-800">
                                
                                <Row title="Loop 1">
                                    <div className="flex items-center gap-0.5 w-full justify-between">
                                        {/* C2 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C2_S1" label="C2 S1" type="SW" />
                                            <Wire active={powerFlow['C2_PTX']?.size > 0} conflict={powerFlow['C2_PTX']?.size > 1} />
                                            <Node id="C2_PTX" label="C2" type="PTX" />
                                            <Wire active={powerFlow['C2_PTX']?.size > 0} conflict={powerFlow['C2_PTX']?.size > 1} />
                                            <Node id="C2_S2" label="C2 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['C4_S1']?.size > 0} conflict={powerFlow['C4_S1']?.size > 1} />

                                        {/* C4 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C4_S1" label="C4 S1" type="SW" />
                                            <Wire active={powerFlow['C4_PTX']?.size > 0} conflict={powerFlow['C4_PTX']?.size > 1} />
                                            <Node id="C4_PTX" label="C4" type="PTX" />
                                            <Wire active={powerFlow['C4_PTX']?.size > 0} conflict={powerFlow['C4_PTX']?.size > 1} />
                                            <Node id="C4_S2" label="C4 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['R1_S1']?.size > 0} conflict={powerFlow['R1_S1']?.size > 1} />

                                        {/* R1 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="R1_S1" label="R1 S1" type="SW" />
                                            <Wire active={powerFlow['R1_PTX']?.size > 0} conflict={powerFlow['R1_PTX']?.size > 1} />
                                            <Node id="R1_PTX" label="R1" type="PTX" />
                                            <Wire active={powerFlow['R1_PTX']?.size > 0} conflict={powerFlow['R1_PTX']?.size > 1} />
                                            <Node id="R1_S2" label="R1 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['C6_S1']?.size > 0} conflict={powerFlow['C6_S1']?.size > 1} />

                                        {/* C6 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C6_S1" label="C6 S1" type="SW" />
                                            <Wire active={powerFlow['C6_PTX']?.size > 0} conflict={powerFlow['C6_PTX']?.size > 1} />
                                            <Node id="C6_PTX" label="C6" type="PTX" />
                                            <Wire active={powerFlow['C6_PTX']?.size > 0} conflict={powerFlow['C6_PTX']?.size > 1} />
                                            <Node id="C6_S2" label="C6 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['C8_S1']?.size > 0} conflict={powerFlow['C8_S1']?.size > 1} />

                                        {/* C8 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C8_S1" label="C8 S1" type="SW" />
                                            <Wire active={powerFlow['C8_PTX']?.size > 0} conflict={powerFlow['C8_PTX']?.size > 1} />
                                            <Node id="C8_PTX" label="C8" type="PTX" />
                                            <Wire active={powerFlow['C8_PTX']?.size > 0} conflict={powerFlow['C8_PTX']?.size > 1} />
                                            <Node id="C8_S2" label="C8 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['H1_S1']?.size > 0} conflict={powerFlow['H1_S1']?.size > 1} />

                                        {/* H1 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="H1_S1" label="H1 S1" type="SW" />
                                            <Wire active={powerFlow['H1_PTX']?.size > 0} conflict={powerFlow['H1_PTX']?.size > 1} />
                                            <Node id="H1_PTX" label="H1" type="PTX" />
                                            <Wire active={powerFlow['H1_PTX']?.size > 0} conflict={powerFlow['H1_PTX']?.size > 1} />
                                            <Node id="H1_S2" label="H1 S2" type="SW" />
                                        </div>
                                    </div>
                                </Row>

                                <Row title="Loop 2">
                                    <div className="flex items-center gap-0.5 w-full justify-between">
                                        {/* C1 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C1_S1" label="C1 S1" type="SW" />
                                            <Wire active={powerFlow['C1_PTX']?.size > 0} conflict={powerFlow['C1_PTX']?.size > 1} />
                                            <Node id="C1_PTX" label="C1" type="PTX" />
                                            <Wire active={powerFlow['C1_PTX']?.size > 0} conflict={powerFlow['C1_PTX']?.size > 1} />
                                            <Node id="C1_S2" label="C1 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['C3_S1']?.size > 0} conflict={powerFlow['C3_S1']?.size > 1} />

                                        {/* C3 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C3_S1" label="C3 S1" type="SW" />
                                            <Wire active={powerFlow['C3_PTX']?.size > 0} conflict={powerFlow['C3_PTX']?.size > 1} />
                                            <Node id="C3_PTX" label="C3" type="PTX" />
                                            <Wire active={powerFlow['C3_PTX']?.size > 0} conflict={powerFlow['C3_PTX']?.size > 1} />
                                            <Node id="C3_S2" label="C3 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['C5_S1']?.size > 0} conflict={powerFlow['C5_S1']?.size > 1} />

                                        {/* C5 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C5_S1" label="C5 S1" type="SW" />
                                            <Wire active={powerFlow['C5_PTX']?.size > 0} conflict={powerFlow['C5_PTX']?.size > 1} />
                                            <Node id="C5_PTX" label="C5" type="PTX" />
                                            <Wire active={powerFlow['C5_PTX']?.size > 0} conflict={powerFlow['C5_PTX']?.size > 1} />
                                            <Node id="C5_S2" label="C5 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['C7_S1']?.size > 0} conflict={powerFlow['C7_S1']?.size > 1} />

                                        {/* C7 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="C7_S1" label="C7 S1" type="SW" />
                                            <Wire active={powerFlow['C7_PTX']?.size > 0} conflict={powerFlow['C7_PTX']?.size > 1} />
                                            <Node id="C7_PTX" label="C7" type="PTX" />
                                            <Wire active={powerFlow['C7_PTX']?.size > 0} conflict={powerFlow['C7_PTX']?.size > 1} />
                                            <Node id="C7_S2" label="C7 S2" type="SW" />
                                        </div>

                                        <Wire active={powerFlow['R2_S1']?.size > 0} conflict={powerFlow['R2_S1']?.size > 1} />

                                        {/* R2 */}
                                        <div className="flex gap-0.5 items-center bg-slate-800/30 p-1.5 rounded">
                                            <Node id="R2_S1" label="R2 S1" type="SW" />
                                            <Wire active={powerFlow['R2_PTX']?.size > 0} conflict={powerFlow['R2_PTX']?.size > 1} />
                                            <Node id="R2_PTX" label="R2" type="PTX" />
                                            <Wire active={powerFlow['R2_PTX']?.size > 0} conflict={powerFlow['R2_PTX']?.size > 1} />
                                            <Node id="R2_S2" label="R2 S2" type="SW" />
                                        </div>
                                        
                                        {/* Phantom Spacer to align Loop 2 with Loop 1 (5 items vs 6 items) */}
                                        <div className="h-1 w-6 shrink-0 opacity-0" />
                                        <div className="min-w-[70px] opacity-0" />
                                    </div>
                                </Row>

                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
